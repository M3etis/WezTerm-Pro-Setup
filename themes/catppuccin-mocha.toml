# Catppuccin Mocha theme for WezTerm
# https://github.com/catppuccin/catppuccin

[colors]
foreground = "#CDD6F4"
background = "#1E1E2E"
cursor_bg = "#F5E0DC"
cursor_border = "#F5E0DC"
cursor_fg = "#1E1E2E"
selection_bg = "#585B70"
selection_fg = "#CDD6F4"

[colors.ansi]
"#45475A"  # black
"#F38BA8"  # red
"#A6E3A1"  # green
"#F9E2AF"  # yellow
"#89B4FA"  # blue
"#F5C2E7"  # magenta
"#94E2D5"  # cyan
"#BAC2DE"  # white

[colors.brights]
"#585B70"  # black
"#F38BA8"  # red
"#A6E3A1"  # green
"#F9E2AF"  # yellow
"#89B4FA"  # blue
"#F5C2E7"  # magenta
"#94E2D5"  # cyan
"#A6ADC8"  # white

[colors.tab_bar]
background = "#11111B"

[colors.tab_bar.active_tab]
bg_color = "#313244"
fg_color = "#CDD6F4"

[colors.tab_bar.inactive_tab]
bg_color = "#11111B"
fg_color = "#6C7086"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#313244"
fg_color = "#CDD6F4"

[colors.tab_bar.new_tab]
bg_color = "#11111B"
fg_color = "#6C7086"

[colors.tab_bar.new_tab_hover]
bg_color = "#313244"
fg_color = "#CDD6F4"
